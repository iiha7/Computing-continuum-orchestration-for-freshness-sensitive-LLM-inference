paths:
  records: data/processed/fires_records.csv
  prompts: data/processed/prompts.csv
  split: data/processed/train_val_test_split.csv
  llm_dir: data/llm_profiles
  fitted_dir: data/fitted
  results_dir: data/results
simulation:
  max_steps_per_episode: 100
  complexity_probs:
    simple: 0.25
    medium: 0.4
    complex: 0.35
  initial_battery: 1.0
  iot_access:
    payload_bytes: 80
    note: Main access delay is LoRa airtime from LoED SF/BW. This block is retained
      only for fallback/debug.
  iot_filter:
    enabled: true
    method: fwi_threshold
    fwi_threshold: 11.2
    local_predicted_class: 0
    local_latency_s: 0.005
    local_energy_j: 0.002
    note: IoT computes or receives FWI locally. If FWI is below the Low/Moderate boundary,
      the packet is not transmitted to the edge and class 0 is returned locally.
  window_lengths:
    simple: 1
    medium: 3
    complex: 6
  edge_llm:
    provider: ollama
    model: qwen2.5:0.5b
    max_output_tokens: 48
    prompt_strategy: shared_decision_support_prompt_no_self_confidence
    note: Final experiments profile a compact local edge LLM. Edge responses do not include self-confidence; reliability is calibrated by src.fit_models.
  cloud_llm:
    provider: ollama
    model: qwen2.5:7b
    max_output_tokens: 256
    latency_scale: 0.30
    prompt_strategy: shared_decision_support_prompt_no_self_confidence
    note: Final experiments use a larger local Ollama LLM as the cloud model for reproducibility. The default latency_scale models GPU-accelerated cloud serving from the local 7B profiling trace; it changes only simulated cloud processing latency and does not require re-profiling.
  constrained_edge_model:
    default: compact edge LLM via Ollama, qwen2.5:0.5b
    use_script: python -m src.profile_llms_real --edge-only
    fallback_script: python -m src.profile_edge_tiny

orchestration:
  cloud_budget:
    enabled: true
    adaptive: true
    scope: episode_requests

    # Used if adaptive=false
    cloud_budget_fraction: 0.40

    # Used if adaptive=true.
    # Budget is selected from the edge-cloud latency burden at episode reset.
    fractions_by_latency_regime:
      Q1_low_latency_burden: 0.60
      Q2_medium_latency_burden: 0.45
      Q3_high_latency_burden: 0.30
      Q4_severe_latency_burden: 0.20
      Q5_tail_latency_burden: 0.10
      unassigned: 0.40
      uncalibrated: 0.40

    # Fallback if the latency-regime name is unavailable.
    fractions_by_network_profile:
      nominal: 0.60
      delay_stress: 0.35
      severe_delay_stress: 0.20

    note: >
      Adaptive cloud budget. When edge-cloud latency burden is low, the DRL
      controller may use cloud more often. Under high-delay cloud conditions,
      the cloud budget is reduced and the controller must reserve cloud for the
      most valuable requests.
freshness:
  sampling_period_s: 10.0
  alpha_max: 1.0
  calibration_quantile: 0.95
  calibration_margin: 1.2
  alpha_min_clip:
  - 0.01
  - 1.0
  utility_at_deadline: 0.5
  task_deadline_multipliers:
    simple: 1.0
    medium: 1.25
    complex: 1.5
  sensitivity_multipliers:
  - 0.5
  - 1.0
  - 1.5
  - 2.0
  metric: age_of_processing
reward:
  w_correct: 5.0
  w_stale: 6.0
  w_aoi: 1.0
  w_bits: 2.0
  w_energy: 0.5
  w_cost: 1.0
  emergency_stale_extra_penalty: 5.0
  task_quality_multipliers:
    simple: 1.0
    medium: 1.15
    complex: 1.3
  note: Reward uses structured response quality, task value, staleness, AoP, communication load, energy,
    and cloud cost; no switching penalty is used for the two-action per-request controller.
normalization:
  mode: empirical_train_quantile
  quantile: 0.95
  fitted_path: data/fitted/normalization.json
  note: max_* values below are fallbacks; run python -m src.calibrate_normalization
    to compute empirical train-split values.
  max_bits_per_request: 40000
  max_energy_j: 20
  max_cost: 0.002
  max_aoi_s: 30
  max_prompt_bytes: 2500
  max_response_bytes: 5000
  max_rtt_ms: 1200
  max_access_delay_s: 5
energy:
  p_edge_infer_w: 6.0
  p_tx_w: 1.5
  p_rx_w: 1.0
  p_idle_w: 0.6
  e_tx_j_per_kbit: 0.0
  e_rx_j_per_kbit: 0.0
cost:
  price_input_per_token: 1.5e-07
  price_output_per_token: 6.0e-07
baselines:
  early_exit:
    confidence_threshold: auto
    threshold_grid: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
    safe_class_max: 1
    lambda_cloud_usage: 0.02
    note: Accept edge output only when calibrated edge reliability is above the validation-selected threshold and the computed FWI danger class is within the safe range; otherwise offload to cloud. Raw LLM self-confidence is not used.

evaluation:
  quality_threshold: 0.75
  note: A profiled decision-support response is acceptable if response_quality >= this threshold.
