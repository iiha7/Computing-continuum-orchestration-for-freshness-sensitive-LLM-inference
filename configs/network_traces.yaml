network_model:
  mode: trace_replay
  access_trace_path: data/network_traces/access_trace.csv
  cloud_rtt_trace_path: data/network_traces/cloud_rtt_trace.csv
  sampling_mode: sequential
  regime_definition:
    variable: normalized_cloud_rtt_burden
    method: train_quantiles
    quantiles:
    - 0.25
    - 0.5
    - 0.75
    - 0.95
  stress_tests:
    nominal:
      delay_multiplier: 1.0
    delay_stress:
      delay_multiplier: 1.5
    severe_delay_stress:
      delay_multiplier: 2.0
  access_reliability:
    snr_bin_width_db: 2.0
    max_attempts: 3
    retransmission_backoff_s: 1.0
    crc_smoothing_alpha: 1.0
    crc_smoothing_beta: 1.0
